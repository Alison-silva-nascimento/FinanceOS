services:
  financeos:
    build:
      context: .
    image: financeos:0.2.0
    restart: unless-stopped
    environment:
      FINANCEOS_DB_FILE: /data/finance.db
      FINANCEOS_BACKUP_DIR: /data/backups
      FINANCEOS_ADMIN_USER: ${FINANCEOS_ADMIN_USER:-alison.nascimento}
      FINANCEOS_SESSION_TIMEOUT_MINUTES: ${FINANCEOS_SESSION_TIMEOUT_MINUTES:-30}
    volumes:
      - financeos_data:/data
    expose:
      - "8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      financeos:
        condition: service_healthy
    environment:
      FINANCEOS_DOMAIN: ${FINANCEOS_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  financeos_data:
  caddy_data:
  caddy_config:
